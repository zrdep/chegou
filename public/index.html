<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>chegou</title>

  <!-- cara de app: cor da barra de status e tela cheia quando salvo na tela inicial -->
  <meta name="theme-color" content="#0b0e11">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="chegou">

  <!-- impede o iPhone de transformar o IP em link de telefone -->
  <meta name="format-detection" content="telephone=no">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230b0e11'/%3E%3Crect x='5' y='3.5' width='6' height='9' fill='%233fb950'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="terminal">

    <header class="titlebar">
      <span class="dots" aria-hidden="true"><span></span><span></span><span></span></span>
      <span class="title" id="host">chegou</span>
      <span class="dots-spacer" aria-hidden="true"></span>
    </header>

    <section class="screen" id="screen">

      <!-- abertura -->
      <div class="boot">
        <p class="line" style="--i: 0"><span class="prompt">$</span><span class="typed">chegou</span></p>
        <p class="line" style="--i: 2"><span class="ok">●</span> <span id="connected-status" data-i18n="boot.connected">conectado ao PC</span></p>
        <p class="line dim" style="--i: 3" id="connected-sub" data-i18n="boot.ready">  pronto pra trocar arquivos</p>
      </div>

      <!-- itens do PC para você -->
      <div class="block" id="pc-area" hidden>
        <p class="line dim" data-i18n="sections.fromPc"># do PC → você</p>
        <ul class="pc-list" id="pc-list"></ul>
      </div>

      <!-- arquivos escolhidos -->
      <div class="block" style="--i: 4">
        <p class="line dim" data-i18n="sections.toPc"># enviar para o PC</p>
        <p class="line dim" id="empty" data-i18n="sections.empty">  nenhum arquivo ainda</p>
        <ul class="files" id="file-list"></ul>
        <p class="line dim" id="total" hidden></p>
      </div>

      <!-- câmera / vídeo direto -->
      <div class="block" id="camera-area" hidden>
        <p class="line dim" id="camera-title" data-i18n="sections.camera"># câmera → PC</p>
        <div class="camera-card" id="camera-card">
          <img class="camera-thumb" id="camera-thumb" alt="" hidden>
          <video class="camera-thumb" id="camera-video-thumb" playsinline muted autoplay loop hidden></video>
          <div class="camera-info">
            <p class="line camera-name" id="camera-name"></p>
            <div class="camera-progress" id="camera-progress">
              <span class="bar" aria-hidden="true">[<span class="track"><span class="fill-bar camera-fill" id="camera-fill"></span></span>]</span>
              <span id="camera-pct">0%</span>
            </div>
            <p class="line dim camera-detail" id="camera-detail"></p>
          </div>
        </div>
      </div>

      <!-- progresso do envio -->
      <div class="block" id="progress-area" hidden>
        <p class="line dim" data-i18n="sections.sending"># enviando</p>
        <div
          class="line progress"
          id="progress"
          role="progressbar"
          aria-label="progresso do envio"
          data-i18n-aria="sections.progressLabel"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <span class="bar" aria-hidden="true">[<span class="track"><span class="fill-bar" id="progress-bar"></span></span>]</span>
          <span id="progress-pct">0%</span>
        </div>
        <p class="line dim" id="progress-detail"></p>
      </div>

      <!-- mensagens: "✓ 3 arquivos enviados", erros... -->
      <div class="block" id="log" aria-live="polite"></div>

      <p class="line cursor-line" style="--i: 4"><span class="prompt">$</span><span class="cursor" aria-hidden="true"></span></p>

    </section>

    <footer class="actions">
      <button type="button" class="btn" id="add" aria-haspopup="dialog" aria-controls="sheet">
        <span id="pick-text" data-i18n="buttons.add">[ + adicionar ]</span>
      </button>
      <button type="button" class="btn btn-primary" id="send" disabled data-i18n="buttons.send">enviar</button>
    </footer>

    <!-- menu "adicionar": sobe de baixo -->
    <div class="sheet-veil" id="sheet-veil" hidden></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
      <p class="line dim" id="sheet-title" data-i18n="sheet.title"># adicionar</p>

      <label class="opt" id="camera-btn">
        <input type="file" id="camera" accept="image/*" capture="environment" class="sr-only">
        <span class="opt-key">›</span>
        <span class="opt-name" id="camera-btn-text" data-i18n="sheet.photo">foto</span>
        <span class="opt-hint" data-i18n="sheet.photoHint">tirar agora</span>
      </label>

      <label class="opt" id="video-btn">
        <input type="file" id="camera-video" accept="video/*" capture="environment" class="sr-only">
        <span class="opt-key">›</span>
        <span class="opt-name" id="video-btn-text" data-i18n="sheet.video">vídeo</span>
        <span class="opt-hint" data-i18n="sheet.videoHint">gravar agora</span>
      </label>

      <label class="opt" id="pick">
        <input type="file" id="files" multiple class="sr-only">
        <span class="opt-key">›</span>
        <span class="opt-name" data-i18n="sheet.files">arquivos</span>
        <span class="opt-hint" data-i18n="sheet.filesHint">galeria e pastas</span>
      </label>

      <button type="button" class="opt opt-cancel" id="sheet-cancel" data-i18n="sheet.cancel">cancelar</button>
    </div>

  </main>

  <!-- traduções: um arquivo por idioma, depois o tradutor, depois o app -->
  <script src="i18n/pt.js"></script>
  <script src="i18n/en.js"></script>
  <script src="i18n/index.js"></script>
  <script src="app.js"></script>
</body>
</html>
